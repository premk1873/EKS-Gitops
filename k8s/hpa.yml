apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notesapp-hpa
  namespace: notesapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notesapp
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30

