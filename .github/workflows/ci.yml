name: GitOps CI - Build, Test and Push to Dockerhub

on:
  push:
    branches: [main]
    paths:
        - 'app.js'
        - 'routes/**'
        - 'middleware/**'
        - 'database/**'
        - 'views/**'
        - 'public/**'
        - 'package.json'
        - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKERHUB_REPO: premkarad18/cloudnotes-app

jobs:
  build-and-push:
    name: build and push Docker Image to HUB.
    runs-on: ubuntu_latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
            
      - name: setup node js
        uses: actions/setup-node@v4
        with :
          node-version: '20'
          cache: 'npm'
        
      - name: install dependencies
        run: npm ci

      - name: Set image tag
        id: tag
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with: 
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ steps.tag.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Update k8s deployment manifest
        run: |
          sed -i "s|image: ${{ env.DOCKERHUB_REPO }}:.*|image: ${{ env.DOCKERHUB_REPO }}:${{ steps.tag.outputs.sha_short }}|" k8s/cloudnotes-deployment.yml

      - name: commit updates manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/cloudnotes-deployment.yml
          git diff --staged --quiet || git commit -m "ci: update cloudnotes image to ${{ steps.tag.outputs.sha_short }} [skip ci]"
          git push